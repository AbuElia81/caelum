<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus Traumfänger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;1,300&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#08051a;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Crimson Pro',serif;
    overflow:hidden;
  }
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d) ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:var(--a)}to{opacity:var(--b);transform:scale(1.4)}}
  .wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
  h1{font-family:'Cinzel Decorative',serif;color:#f0d080;font-size:clamp(.8rem,2.2vw,1.25rem);
     letter-spacing:.28em;text-align:center;text-shadow:0 0 30px rgba(201,168,76,.5);margin-bottom:.2rem}
  .sub{font-style:italic;color:#c8b8e0;font-size:clamp(.6rem,1.3vw,.78rem);letter-spacing:.15em;opacity:.7;margin-bottom:1rem}
  .dc{animation:float 6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  svg{filter:drop-shadow(0 0 22px rgba(201,168,76,.2))}
  .legend{display:flex;gap:1.5rem;margin-top:.8rem;align-items:center;justify-content:center}
  .li{display:flex;align-items:center;gap:.35rem;font-style:italic;color:#c8b8e0;
      font-size:clamp(.55rem,1.1vw,.7rem);opacity:.75;letter-spacing:.06em}
  .ld{width:9px;height:9px;border-radius:50%;display:inline-block}
  @keyframes beadPulse{from{opacity:.7}to{opacity:1}}
</style>
</head>
<body>

<style>
@keyframes sway1{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}

@keyframes blink{0%,100%{opacity:.7}50%{opacity:1}}

<script>
// ── Stars ──────────────────────────────────────────
const st = document.getElementById('stars');
for(let i=0;i<160;i++){
  const s=document.createElement('div'); s.className='star';
  const z=Math.random()*2+.3;
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;--d:${2+Math.random()*4}s;--a:${.1+Math.random()*.3};--b:${.5+Math.random()*.5};animation-delay:${Math.random()*5}s`;
  st.appendChild(s);
}

const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('sv');

// ── Moon-Venus beads ───────────────────────────────
// Each of the 5 sectors (one per Venus cycle) gets:
//   8 morning-star beads (warm pearl) on inner petal half
//   8 evening-star beads (blue-silver) on outer petal half
// Beads are placed along the petal bisector with slight scatter

// Bisector angles (deg, measured clockwise from top=0°)
// Petal 1 bisects P0(top) & P1(upper-right)  → 306° = -54°
// Petal 2 bisects P1 & P2                    → 18°
// Petal 3 bisects P2 & P3 (bottom)           → 90°
// Petal 4 bisects P3 & P4                    → 162°
// Petal 5 bisects P4 & P0                    → 234°
const bisect = [-54, 18, 90, 162, 234];
// r range inside the ring (avoid center gem r<22 and orbit r=148)
const rMin=26, rMax=143;
// deterministic lateral jitter (in pixels, perpendicular to bisector)
const JIT=[
  [ 2,-3, 4,-2, 3,-4, 1,-3, 2,-4, 3,-1, 4,-2, 1,-3],
  [-2, 4,-3, 2,-4, 3,-1, 4,-2, 3,-4, 1,-3, 2,-1, 4],
  [ 3,-2, 4,-3, 1,-4, 2,-3, 4,-1, 3,-4, 2,-1, 3,-2],
  [-3, 2,-1, 4,-2, 3,-4, 1,-3, 4,-2, 3,-1, 4,-3, 2],
  [ 4,-1, 3,-4, 2,-3, 1,-4, 3,-2, 4,-1, 3,-4, 2,-3]
];
const cycLabel=['I','II','III','IV','V'];

const beadLayer=document.getElementById('beads');

bisect.forEach((deg,ci)=>{
  const rad=deg*Math.PI/180;
  const bx=Math.sin(rad), by=-Math.cos(rad); // unit vec (SVG: y down)
  const px=-by, py=bx;                       // perpendicular

  // 8 morning (inner half), 8 evening (outer half)
  const rMid=(rMin+rMax)/2;
  for(let i=0;i<16;i++){
    const morn=i<8;
    const idx=morn?i:i-8;
    const rS=morn?rMin:rMid+5, rE=morn?rMid-5:rMax;
    const t=(idx+.5)/8;
    const r=rS+t*(rE-rS);
    const jit=(JIT[ci][i]||0)*1.7;
    const cx=bx*r+px*jit;
    const cy=by*r+py*jit;

    const g=document.createElementNS(NS,'g');
    g.setAttribute('filter','url(#bg)');

    // halo ring
    const h=document.createElementNS(NS,'circle');
    h.setAttribute('cx',cx.toFixed(1)); h.setAttribute('cy',cy.toFixed(1)); h.setAttribute('r','5.5');
    h.setAttribute('fill',morn?'rgba(255,253,190,.15)':'rgba(150,190,255,.15)');
    g.appendChild(h);

    // bead body
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',cx.toFixed(1)); c.setAttribute('cy',cy.toFixed(1)); c.setAttribute('r','3.5');
    c.setAttribute('fill',morn?'url(#mg)':'url(#eg)');
    c.setAttribute('stroke',morn?'rgba(255,248,200,.8)':'rgba(180,210,255,.8)');
    c.setAttribute('stroke-width','.7');
    c.style.animation=`blink ${2.4+(i%3)*.5}s ease-in-out infinite`;
    c.style.animationDelay=`${i*.15+ci*.35}s`;
    g.appendChild(c);

    // glint
    const gl=document.createElementNS(NS,'circle');
    gl.setAttribute('cx',(cx-.9).toFixed(1)); gl.setAttribute('cy',(cy-.9).toFixed(1)); gl.setAttribute('r','0.9');
    gl.setAttribute('fill','rgba(255,255,255,.9)');
    g.appendChild(gl);

    const ti=document.createElementNS(NS,'title');
    ti.textContent=`Zyklus ${cycLabel[ci]} · ${morn?'☀ Morgenstern':'🌙 Abendstern'} · Mond-Venus-Begegnung ${idx+1}`;
    g.appendChild(ti);

    beadLayer.appendChild(g);
  }
});

// ── Birds (one per cycle, on petal bisector at r≈163, outside orbit) ──
// A small silhouette of a bird in flight, scaled ~12px
// Each bird placed just outside the Venus orbit on each bisector

function makeBird(cx,cy,scale,rot){
  // Simple bird: two curved wings from center
  const g=document.createElementNS(NS,'g');
  g.setAttribute('transform',`translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(${rot}) scale(${scale})`);
  // Wings: two arcs
  const p=document.createElementNS(NS,'path');
  // Wing shape: M 0,0 Q -9,-6 -16,0 M 0,0 Q 9,-6 16,0
  p.setAttribute('d','M0,0 Q-9,-5 -16,1 M0,0 Q9,-5 16,1');
  p.setAttribute('stroke','#e8d8a0');
  p.setAttribute('stroke-width','1.5');
  p.setAttribute('fill','none');
  p.setAttribute('stroke-linecap','round');
  p.setAttribute('opacity','.82');
  g.appendChild(p);

  // Subtle glow behind bird
  const gl=document.createElementNS(NS,'ellipse');
  gl.setAttribute('rx','14'); gl.setAttribute('ry','5');
  gl.setAttribute('fill','rgba(201,168,76,.12)');
  g.insertBefore(gl,p);

  // Animation: gentle flutter
  const delay=Math.random()*2;
  g.style.animation=`birdFloat 5s ease-in-out infinite`;
  g.style.animationDelay=`${delay}s`;

  return g;
}

// Place birds at r=165 on each bisector (just outside orbit, nicely between orbit and ring)
const birdsLayer=document.getElementById('birds');
bisect.forEach((deg,ci)=>{
  const rad=deg*Math.PI/180;
  const r=165;
  const bx=Math.sin(rad)*r;
  const by=-Math.cos(rad)*r;
  // Bird rotation: align wings roughly horizontal, slight tilt toward center
  const rot=deg; // face outward
  const b=makeBird(bx,by,0.95,deg-90);
  birdsLayer.appendChild(b);
});
